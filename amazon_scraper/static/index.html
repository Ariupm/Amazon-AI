<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>采数 · Amazon 真实数据采集器</title><link rel="stylesheet" href="/static/style.css"><style>.mainCandidate{display:flex;justify-content:space-between;gap:16px;margin-top:12px;padding:11px 14px;border:1px solid #b8d9ca;border-radius:9px;background:#eaf5ef;color:#0c6b54}.mainCandidate b{font-size:11px}.mainCandidate span{font-size:9px}.variantTable tr.suspectedMain{background:#eff8f3}.mainBadge{display:inline-block!important;margin:0 6px 0 0!important;padding:3px 5px;border-radius:4px;background:#0c6b54;color:#fff;font-size:7px;font-style:normal}</style></head>
<body>
  <header><div class="brand"><i>采</i><b>采数</b></div><span class="real"><i></i> 本机真实浏览器模式</span></header>
  <main>
    <section class="hero">
      <div><span class="eyebrow">AMAZON REAL DATA</span><h1>真实商品数据采集器</h1><p>浏览器实际访问 Amazon 页面。只有读取到真实商品标题才会返回结果，不生成模拟内容。</p></div>
      <form id="form" style="max-width:980px;grid-template-columns:2.2fr .65fr .65fr .8fr 1fr">
        <label class="asinField">商品 ASIN（支持批量）<textarea id="asins" placeholder="每行一个，或用逗号分隔&#10;B0CT1NWL9J" required></textarea><small id="asinCount">0 个 ASIN</small></label>
        <label>站点<select id="market"><option value="US">美国站</option><option value="UK">英国站</option><option value="DE">德国站</option><option value="JP">日本站</option></select></label>
        <label>评论页数<select id="pages"><option>1</option><option selected>2</option><option>3</option><option>5</option></select></label>
        <label>变体模式<select id="variantMode"><option value="full" selected>完整逐子体</option><option value="fast">极速清单</option></select></label>
        <button id="submit">开始真实采集</button>
      </form>
      <div class="notice">默认逐个打开已确认子体，采集实时价格、月销量和高清主图。遇到登录时会一直等待，登录完成后才继续；变体很多时可改用“极速清单”。</div>
    </section>
    <section id="status" class="status hidden"></section>
    <section id="batchSummary" class="batchSummary hidden"></section>
    <section id="result" class="hidden"></section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
